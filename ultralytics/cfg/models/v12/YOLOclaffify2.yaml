
nc: 3  # 例如，10 表示 10 种植物叶片病害类别

scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv,  [64, 3, 2]]
  - [-1, 1, Conv,  [128, 3, 2]]
  - [ -1, 2, C3k2_CoordAtt, [ 256, 256, 0.25 ] ]
  - [-1, 1, Conv,  [256, 3, 2]]
  - [-1, 2, C3k2,  [512, False, 0.25]]
  - [-1, 1, Conv,  [512, 3, 2]]
  - [-1, 4, A2C2f, [512, True, 4]]
  - [-1, 1, Conv,  [1024, 3, 2]]
  - [-1, 4, A2C2f, [1024, True, 1]]

head:
  - [ -1, 1, nn.Upsample, [ None, 2, "nearest" ] ]  # 将最后一层上采样因子改为 4
  - [ [ -1, 6 ], 1, Concat, [ 1 ] ]                    # 拼接两路特征
  - [ -1, 2, A2C2f_FMA, [ 512, False, 1 ] ]           # 后续处理

  - [ -1, 1, nn.Upsample, [ None, 2, "nearest" ] ]
  - [ [ -1, 4 ], 1, Concat, [ 1 ] ]
  - [ -1, 2, A2C2f_FMA, [ 256, False, 1 ] ]

  - [ -1, 1, Conv, [ 256, 3, 2 ] ]
  - [ [ -1, 11 ], 1, Concat, [ 1 ] ]
  - [ -1, 2, A2C2f_FMA, [ 512, False, 1 ] ]

  - [ -1, 1, Conv, [ 512, 3, 2 ] ]
  - [ [ -1, 8 ], 1, Concat, [ 1 ] ]
  - [ -1, 2, C3k2, [ 1024, True ] ]
  - [-1, 1, Classify, [nc]]
